name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The screenshots live in docs/ for the README; copy them in rather than keeping two copies.
      - name: Assemble site
        run: |
          mkdir -p _site/img
          cp -R site/. _site/
          cp docs/banner.png docs/infinite-timeline-view-sshot.png docs/time-report-view-sshot.png _site/img/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
